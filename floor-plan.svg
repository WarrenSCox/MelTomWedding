<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
<rect width="1200" height="1500" fill="#f7f3e9"/>
<style>
  .title{font-family:cursive;font-size:72px;fill:#1e201d}
  .label{font-family:Georgia,serif;font-size:23px;letter-spacing:3px;fill:#1e201d}
  .name{font-family:Georgia,serif;font-size:18px;letter-spacing:1.5px;fill:#1e201d}
  .table{fill:none;stroke:#333;stroke-width:2}
  .leaf{fill:none;stroke:#66735d;stroke-width:3;stroke-linecap:round}
  .leafFill{fill:#66735d;opacity:.86}
</style>

<!-- restrained botanical canopy -->
<g opacity=".9">
